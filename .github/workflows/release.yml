name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/tests.yml
  package:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -v
      - run: python scripts/check_docs.py
      - name: Check version matches release tag
        run: python -c "import os, tomllib; from loc_cli import __version__; assert os.environ['GITHUB_REF_NAME'] == 'v' + __version__; assert tomllib.load(open('pyproject.toml', 'rb'))['project']['version'] == __version__"
      - run: python -m pip install build
      - run: python -m build
      - name: Create checksums and installer assets
        run: python scripts/release_assets.py
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
